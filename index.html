적인 자극에 날이 서는 느낌, ‘화’는 더 크고 분명한 부당함이나 침해에 대한 강한 감정이에요.", "같은 소음이 계속 거슬린다", "내 약속이 일방적으로 깨졌다"], ["답답하다", "막막하다", "‘답답하다’는 막혀서 풀리지 않는 지금의 느낌, ‘막막하다’는 앞길이나 방법이 보이지 않는 느낌이에요.", "말을 해도 전혀 전해지지 않는다", "무엇부터 해야 할지 모르겠다"], ["외롭다", "쓸쓸하다", "‘외롭다’는 함께할 사람이 없다는 관계의 결핍에 가깝고, ‘쓸쓸하다’는 빈자리가 느껴지는 조용한 정서에 가까워요.", "연락할 사람이 떠오르지 않는다", "모두 떠난 뒤 불 꺼진 사무실에 남았다"], ["지쳤다", "무기력하다", "‘지쳤다’는 쏟아서 힘이 다한 상태로 쉬면 나아질 수 있고, ‘무기력하다’는 쉬어도 하고 싶은 마음이 잘 생기지 않는 쪽에 가까워요.", "일주일 내내 야근했다", "쉬는 날에도 아무것도 하고 싶지 않다"], ["부끄럽다", "창피하다", "‘부끄럽다’는 수줍음부터 스스로 떳떳하지 못한 마음까지 넓게 쓰이고, ‘창피하다’는 남 앞에서 체면이 깎인 상황에 더 초점이 있어요.", "칭찬을 받으니 얼굴이 빨개졌다", "사람들 앞에서 크게 넘어졌다"], ["부럽다", "질투 나다", "‘부럽다’는 남이 가진 것을 나도 갖고 싶은 마음에서 멈추고, ‘질투 나다’는 그 사람이 가진 것이 나를 불편하게 하거나 뺏기는 느낌이 섞일 때 더 자주 쓰여요.", "친구가 원하던 회사에 붙었다", "아끼는 친구가 다른 친구와 더 가까워졌다"], ["미안하다", "죄책감", "‘미안하다’는 상대에게 폐를 끼쳐 마음이 편치 않은 것이고, ‘죄책감’은 내 잘못으로 누군가 다쳤다고 느끼며 더 무겁고 오래 남는 마음이에요.", "약속에 10분 늦었다", "내 말 때문에 친구가 크게 상처받은 걸 알았다"], ["후회되다", "자책하다", "‘후회되다’는 지난 선택을 되돌리고 싶은 마음이고, ‘자책하다’는 그 일을 내 탓으로 돌려 나를 몰아세우는 데까지 나아간 마음이에요.", "그때 다른 쪽을 고를걸 싶다", "내가 더 신경 썼으면 안 그랬을 거라며 계속 나를 탓한다"], ["무섭다", "두렵다", "둘 다 위험을 느끼는 마음이에요. 일반적으로 ‘무섭다’는 눈앞의 대상이나 상황에 대한 즉각적인 반응에, ‘두렵다’는 앞으로 일어날 일이나 잃을 수 있는 것을 생각할 때 더 자주 쓰여요.", "어두운 골목에서 뒤쪽 발소리가 가까워졌다", "실패하면 다시 일어설 수 있을지 모르겠다"], ["걱정되다", "불안하다", "‘걱정되다’는 무엇이 염려되는지 대상을 말할 수 있을 때, ‘불안하다’는 대상이 흐릿해도 마음이 놓이지 않고 술렁일 때 더 자주 쓰여요.", "내일 비 소식이 있어 야외 행사가 걱정이다", "특별한 일은 없는데 마음이 계속 가라앉지 않는다"], ["당황스럽다", "당혹스럽다", "둘 다 예상 못 한 일로 어쩔 줄 모르는 마음이에요. ‘당황스럽다’는 갑작스러운 상황에 허둥대는 쪽에, ‘당혹스럽다’는 상황이 이해되지 않거나 곤란해서 난처한 쪽에 무게가 실려요.", "발표 중에 화면이 갑자기 꺼졌다", "믿었던 사람이 앞뒤가 다른 말을 했다"], ["공허하다", "허무하다", "‘공허하다’는 마음 안이 비어 채워지지 않는 느낌에, ‘허무하다’는 애쓴 것이나 의미가 덧없이 느껴질 때 더 자주 쓰여요.", "실컷 놀고 집에 왔는데 마음이 텅 빈 것 같다", "몇 달 준비한 일이 한순간에 없던 일이 됐다"], ["뿌듯하다", "자랑스럽다", "둘 다 해낸 일에 대한 좋은 마음이에요. ‘뿌듯하다’는 속이 꽉 차오르는 만족감에, ‘자랑스럽다’는 드러내 보이고 싶을 만큼 당당한 마음에 더 가까워요. ‘자랑스럽다’는 다른 사람에게도 자주 써요.", "혼자 끝까지 가구를 조립했다", "동생이 오래 준비한 시험에 붙었다"], ["안도하다", "후련하다", "‘안도하다’는 걱정하던 일이 괜찮아져 마음이 놓이는 것, ‘후련하다’는 막혀 있던 것이 풀리거나 하고 싶은 말을 해서 속이 시원한 것에 더 가까워요.", "늦도록 연락 없던 가족
